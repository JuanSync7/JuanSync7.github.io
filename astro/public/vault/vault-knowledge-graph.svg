<title id="vault-knowledge-graph-title">Experience vault / knowledge graph</title>
<desc id="vault-knowledge-graph-desc">arrows = the named relation from one record to another · lit = an example lesson Illustrative records only. Two pages can share a group and link sideways; an explicit supported_by relation provides a route to evidence. Following a link exposes a source to inspect, not a guarantee that its claim is true. Group: The invented topic Retry policy and lesson Bound retry work each belong to the Reliable systems grouping page. Cross-link: The lesson links sideways to the topic; their shared group supplies another route between them. Inspect evidence: The lesson has an illustrative supported_by relation to an invented work note. Its evidence and trust labels still need to be read. Enter anywhere: Start at a group, topic, lesson or source. Follow outgoing relations, backlinks or inverse membership to discover wider context.</desc>
