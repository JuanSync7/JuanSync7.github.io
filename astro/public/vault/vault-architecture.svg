<title id="vault-architecture-title">Experience vault / architecture</title>
<desc id="vault-architecture-desc">arrows = inputs read by the next component · lit = hand-authored guidance Collected evidence becomes generated notes, then an indexed graph that a reader or agent can inspect. Authored guidance stays separately owned and can also be selected directly. Privacy and publication checks cover the outgoing bundle across these stages. Collect: Work records and source notes provide evidence for the record. Summarise: Bounded, cached model calls produce structured accounts. Hand-authored guidance is a separate input, with its own authority. Render and index: Rebuildable notes receive metadata, identities, links and grouping routes; the index makes those routes searchable. Retrieve: A reader or calling agent searches, inspects and selects source context, including authored guidance directly. Privacy and publication checks govern what may leave the system.</desc>
