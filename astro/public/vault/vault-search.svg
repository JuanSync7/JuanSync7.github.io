<title id="vault-search-title">Experience vault / search</title>
<desc id="vault-search-desc">arrows = the next retrieval step · lit = inspecting the source and its trust The current navigator combines exact name resolution with weighted token search, then exposes graph routes and source trust for inspection. This describes retrieval, without implying vector search or an automatically generated answer. Resolve: Exact paths and aliases identify records; ambiguous names remain candidates rather than being silently merged. Rank: Word matches in titles, aliases, summaries, bodies and grouping context produce candidate pages. Common metadata keys are excluded from body terms. Navigate: Inspect the candidate’s groups, backlinks and supported typed relations. A reader or calling agent chooses which routes to follow. Read: Open the evidence and keep its authority, inference, review state and freshness visible. Select: Choose a bounded set of relevant sources for the task. Search and navigation do not establish semantic answer correctness.</desc>
