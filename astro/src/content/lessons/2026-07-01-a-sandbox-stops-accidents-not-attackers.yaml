  "title": "A sandbox stops accidents, not attackers.",
  "why": "It constrains a well-meaning agent. Stopping a hostile user is the network layer's job, at the firewall or proxy.",
  "problem": "A tool restriction can look like a security boundary while leaving the user free to launch the same operation another way.",
  "cause": "A cooperative agent follows its tool rules. A hostile caller can choose a different process or client unless the operating system or network enforces the restriction independently.",
  "steps": [
    "Name the asset and the caller being constrained before choosing the control.",
    "Put egress policy in a firewall or controlled proxy, and restrict credentials separately.",
    "Try an ordinary child process as well as the agent’s named tools when checking coverage."
  ],
  "solution": "Use agent sandboxing to reduce accidental reach, and enforce the required boundary at the layer the caller cannot edit. For example, blocking a file-reading tool does not by itself stop another program from using an accessible credential.",
  "verification": "A useful check attempts the prohibited action through both allowed and alternate clients, and confirms that the enforcing layer records a refusal.",
  "limitations": "The headline is shorthand: hardened sandboxes can resist hostile code too. The warning concerns editable tool policy and incomplete sandbox coverage, not every sandbox design.",
