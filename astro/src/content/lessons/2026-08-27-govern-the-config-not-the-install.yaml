{
  "date": "2026-08-27",
  "tag": "ops",
  "title": "Govern the config, not the install.",
  "why": "You don't have to win the argument about how people install a tool if a managed policy file applies to every copy on the host.",
  "problem": "A host can contain several installations of the same tool, making a rule tied to one executable path incomplete.",
  "cause": "Installation method and policy scope are separate choices. If supported clients read a higher-precedence managed configuration, that shared boundary can govern their behaviour without controlling every package manager.",
  "steps": [
    "Identify the documented managed-policy path and precedence for the client versions you support.",
    "Deploy the protected configuration there, then test each installation route, including editor-bundled clients, against a policy action that should be denied."
  ],
  "solution": "Keep one supported host policy and a minimum-version rule where needed. Record which clients actually consume it rather than assuming a shared filename makes all binaries compliant.",
  "verification": "For each supported client, inspect effective settings and attempt a harmless denied action in a test environment. Expect the same denial and useful diagnostics across installation methods.",
  "limitations": "This is governance for clients that honour the policy. Unsupported versions, bypass modes or users who can alter the enforcement layer need separate controls; a configuration file alone is not a hostile-user boundary."
}
