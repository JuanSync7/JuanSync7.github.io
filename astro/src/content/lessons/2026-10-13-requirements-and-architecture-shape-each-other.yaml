    "Write a small set of goals and a rough architecture together. Allocate each requirement across the parts that contribute to it, identifying the budget or interface each part must meet.",
    "Use what the allocation reveals to refine the requirement or change the design. Record the trade-off, then repeat the loop at the next useful level of detail."
  ],
