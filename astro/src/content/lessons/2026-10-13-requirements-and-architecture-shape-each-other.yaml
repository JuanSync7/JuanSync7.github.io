  "title": "Requirements and architecture shape each other.",
  "why": "A design choice shows a requirement is vague or too costly; a requirement shows a missing block. Write them together, in short loops.",
  "problem": "Finishing all requirements before exploring any architecture can hide an impossible or needlessly expensive demand. Designing first can hide the opposite problem: a neat system with no answer to an actual need.",
  "cause": "Requirements constrain the design, while design choices expose missing detail and derived obligations. Working in only one direction delays that feedback until changes have more dependencies.",
