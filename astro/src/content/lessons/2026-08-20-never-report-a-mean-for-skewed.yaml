  "title": "Never report a mean for skewed durations.",
  "why": "Resolution times have long tails, so the mean misleads. Give n, coverage and method alongside any figure you report.",
  "problem": "A single average resolution time can conceal a queue where most work finishes quickly and a few cases remain open much longer.",
  "cause": "A long tail can pull the arithmetic mean away from the typical case. Missing, contaminated or selectively collected durations can make even a median untrustworthy.",
  "steps": [
    "Inspect the duration distribution and define which records qualify before choosing a summary.",
    "Return the sample count, coverage and calculation method with any statistic; refuse the figure when the sample cannot support the requested interpretation."
