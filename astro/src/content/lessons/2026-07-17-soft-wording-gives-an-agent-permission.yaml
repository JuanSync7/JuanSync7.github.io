  "tag": "agents",
  "title": "Soft wording gives an agent permission to skip.",
  "why": "A protocol step loses to the main task unless it is written as a commitment, with a named trigger and stop behaviour.",
  "problem": "An agent can treat a protocol step as optional when the instruction leaves its trigger or failure behavior open to interpretation.",
  "cause": "Words such as “consider” describe a preference. During a competing main task, a preference may be skipped because the model has no clear condition that makes the step mandatory.",
  "steps": [
    "Name the event that triggers the rule.",
    "State the required action and the evidence that counts as completion.",
    "State what to do if the action cannot complete, including any required stop."
  ],
  "solution": "For example, “Before reporting completion, run the named check; if it cannot run, report the blocker and do not claim a pass” gives the agent a decision it can apply. “Try to test” leaves the important branch unspecified.",
  "verification": "Exercise the instruction with a successful check and a missing prerequisite. Inspect whether the agent reports the actual result and follows the defined stop behavior.",
  "limitations": "Stronger wording helps clarify intent, but a prompt remains guidance. Put high-consequence requirements in enforceable gates rather than relying on capitalization or repetition alone.",
  "category": "ai-and-agents",
