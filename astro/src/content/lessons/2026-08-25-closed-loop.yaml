  "title": "Close the loop like a control system.",
  "why": "Agents should check their own output and correct against the error, the way a controller corrects against a sensor. Open-loop agents drift.",
  "problem": "An agent that produces output and immediately declares completion can repeat the same mistake without ever seeing the error.",
  "cause": "A corrective loop needs a target, an observation of the result and a comparison that changes the next action. Asking for “better work” supplies none of those on its own.",
  "steps": [
    "Choose the observable acceptance condition and run the check against the produced artifact.",
    "Feed the specific failing evidence back into a bounded correction step, then repeat the check on the revised artifact."
  ],
  "solution": "For a generated configuration, parse and validate the actual file before asking the agent to fix any reported field. Keep the validator independent of the prose claim that the file is valid.",
  "verification": "Deliberately include one invalid value in a disposable example. Expect the check to reject it and identify the field; completion should require a fresh check of the corrected bytes.",
  "limitations": "A faulty sensor drives a faulty loop. Human judgment still matters for goals and uncheckable quality, and retry limits must surface unresolved failure rather than looping indefinitely.",
