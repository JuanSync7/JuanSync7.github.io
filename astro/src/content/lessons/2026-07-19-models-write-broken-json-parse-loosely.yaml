  "title": "Models write broken JSON. Parse loosely, check strictly.",
  "why": "Raw line breaks and invalid escapes are common in model output. Tolerant parsing followed by strict validation keeps good answers without trusting bad ones.",
  "problem": "A useful model answer can fail JSON parsing because of a formatting defect, while a permissively parsed answer can still contain invalid data.",
  "cause": "Parsing and validation solve different problems. A tolerant parser may recover a representation, but only strict validation can decide whether its fields, types and values meet the consumer’s contract.",
  "steps": [
    "Preserve the raw model response for diagnosis.",
    "Apply only a defined, bounded set of syntax repairs.",
    "Validate the recovered object strictly before any downstream action, and reject ambiguous recovery."
  ],
  "solution": "For example, repairing a raw line break inside a string should not authorize an unknown action field. Keep the original response and record the repair so a later failure can be traced to what the model actually returned.",
  "verification": "Replay captured malformed answers and planted invalid fields through the real parser and validator. Confirm recoverable syntax succeeds while wrong shape and meaning still fail.",
  "limitations": "Syntax repair can change meaning, so keep it narrow. Some applications should retry or reject malformed output entirely; tolerant parsing is not permission to guess missing facts.",
