  "tag": "security",
  "title": "Let the firewall own the network boundary.",
  "why": "An allowed-domains list inside a sandbox drifts and is hard to audit. The proxy already sees every connection.",
  "problem": "A list of blocked download commands does not control where an agent can send data. The same network request may be made through a library, another executable or a child process.",
  "cause": "Tool rules see particular invocations. A firewall or mandatory proxy sees traffic at a lower boundary, so policy can apply regardless of which program initiated the connection.",
  "steps": [
    "Map the required destinations and protocols, including non-HTTP services that ordinary tools need. Place the policy at an enforced network boundary and make its ownership clear.",
    "Ensure workloads cannot simply bypass the proxy through a direct route. Log allowed and denied destinations at that boundary, then keep tool-level restrictions as additional guards."
  ],
  "solution": "Give one network control responsibility for outbound access. This reduces the chance that several partial domain lists drift while each appears to cover the whole system.",
  "verification": "From a controlled test workload, try an allowed destination and a harmless disallowed one through more than one client. The policy should hold across those execution paths.",
  "limitations": "A proxy controls only traffic forced through it, and domain rules can be difficult for raw TCP services. The historical egress control was still a prerequisite, not a completed protection.",
