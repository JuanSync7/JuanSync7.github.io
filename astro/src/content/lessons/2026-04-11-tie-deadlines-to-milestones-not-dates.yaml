  "title": "Tie deadlines to milestones, not dates.",
  "why": "Date deadlines go overdue on paper whenever a schedule slips, which trains reviewers to clear the flag instead of the debt.",
  "problem": "A deferred task becomes overdue whenever the schedule slips, even if the project has not reached the stage where that task matters. Repeated false alarms make the warning easy to clear.",
  "cause": "A calendar deadline and a delivery dependency answer different questions. Work tied to a milestone should become overdue when that milestone passes.",
  "steps": [
    "Give the deferral an owner and a reason.",
    "Name the milestone by a stable identifier.",
    "Compute overdue status from that milestone’s current state, keeping the debt visible until it is resolved."
  ],
  "solution": "For example, attach a required review to “integration passed.” If integration moves, the review still has the same trigger; no date needs to be edited just to make the dashboard quiet.",
  "verification": "Change the milestone from pending to passed and expect the unresolved deferral to become overdue. Moving an unrelated calendar date should not discharge it.",
  "limitations": "Use calendar deadlines where time itself is the obligation, such as a contract or certificate expiry. Milestone-based expiry is useful for delivery dependencies, not every kind of deadline.",
