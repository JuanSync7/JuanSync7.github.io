  "tag": "security",
  "title": "A limited token beats a path deny.",
  "why": "Deny rules match text, and child programs like git read their own config. A narrowly scoped token stays narrow whatever reads it.",
  "problem": "A path restriction can be bypassed in effect when an allowed child program loads the same credential through its own configuration.",
  "cause": "Tool rules often match the operation presented to the agent interface. Programs such as Git can resolve credentials independently, so denying one named file read does not limit what an already available token can authorize.",
  "steps": [
    "Give automation the narrowest practical credential scope.",
    "Keep credentials outside the caller’s reach when a broker must enforce per-user policy.",
    "Test the actual child programs and credential helpers, not only direct file tools."
  ],
  "solution": "For example, a token limited to one repository remains limited when another client reads it. That is a property of server-side authorization, rather than the spelling of the local command used to obtain it.",
  "verification": "Use controlled allowed and disallowed operations to confirm the credential’s scope. Also check that alternative authentication paths do not silently supply a broader credential.",
  "limitations": "Limited credentials can still expose or modify data within their scope. Combine them with operating-system and network controls; a token scope is one boundary, not complete isolation.",
  "category": "security-and-networking",
  "tags": [
    "security",
    "git"
  ]
}
