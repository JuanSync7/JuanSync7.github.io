{
  "date": "2026-10-03",
  "tag": "frontend",
  "title": "Test the response shape with the route.",
  "why": "A route that returns 200 with the wrong shape passes a status check. Checking the shape is the same test, extended.",
  "problem": "A route can return HTTP 200 and still break its client. The request succeeded, but a missing field, changed type or unexpected null may leave a blank column or a runtime error.",
  "cause": "A status check covers transport success. The response contract also includes field names, nesting, lists and whether a value may be absent or null.",
  "steps": [
    "Extend a route test to validate the returned body against the declared response schema. Include a representative object and empty or nullable cases that clients actually handle.",
    "Generate client types from the same contract where possible. Keep generation and schema-drift checks in the build so a stale committed file fails visibly."
  ],
  "solution": "Use one contract to connect server output, tests and client expectations. This avoids maintaining a second handwritten shape that can drift in exactly the same way as the application.",
  "verification": "As an illustrative check, rename a required response field in a scratch change. The contract or client check should fail even though the endpoint still returns 200.",
  "limitations": "Shape checks do not prove that a value is correct or that the live service returns the expected data. They complement semantic assertions and a few real integration checks.",
  "category": "frontend-and-design",
  "tags": [
    "frontend",
    "contracts",
    "testing"
  ]
}
