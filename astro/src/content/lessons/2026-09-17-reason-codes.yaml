  "title": "One field can mean different things in different states.",
  "why": "A scheduler's reason code explains why a pending job waits, but on a running job it means something else. Summing it as wait time is wrong.",
  "problem": "A scheduler reason field can create fictitious wait time if its meaning is assumed to be the same in every state.",
  "cause": "The field is contextual. A reason attached to a running or terminal job does not necessarily describe time that job spent pending, so summing records without a state rule changes the metric.",
  "steps": [
    "Define which job states count as waiting.",
    "Count intervals only while the job meets that state definition.",
    "Keep transitions and missing observations explicit when deriving duration."
  ],
  "solution": "Illustrative: a reason value repeated on a running job should not add another poll interval to pending time simply because the string still exists.",
  "verification": "Inspect a sample job's state timeline alongside the calculated wait. The measured intervals should lie inside its actual pending periods and reconcile with the chosen time window.",
  "limitations": "Periodic observations cannot always locate transition instants exactly. Report the sampling boundary and do not mix scheduler wait with a tool's later runtime licence wait."
