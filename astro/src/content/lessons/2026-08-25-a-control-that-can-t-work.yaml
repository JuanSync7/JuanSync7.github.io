  "title": "A control that can't work is worse than none.",
  "why": "BlockIOWeight on RHEL 8 needs the CFQ scheduler, which was removed, so it reads as protection while enforcing nothing. Reading the value back proves acceptance, not effect.",
  "problem": "A resource limit can appear in a service manager’s configuration while doing nothing on the host where it was deployed.",
  "cause": "The manager accepting a property does not establish kernel support, the active scheduler or that the constrained process sits in the intended group.",
