{
  "date": "2026-07-09",
  "tag": "design",
  "title": "Tight coupling is the real sin.",
  "why": "A wrong choice is fine if the module can be swapped out. Coupling is what turns a wrong choice into a rewrite.",
  "problem": "A poor component choice becomes expensive when its assumptions spread through the rest of the system.",
  "cause": "Coupling means other modules depend on details that should belong to one component. Replacing that component then requires changing callers, stored data or control flow across the system.",
  "steps": [
    "Define the behavior callers need before choosing the implementation.",
    "Keep vendor-specific types and settings behind a small adapter.",
    "Make dependencies flow through the contract rather than importing implementation details everywhere."
  ],
  "solution": "For example, a storage interface can expose read and write operations without requiring every caller to know a database driver’s connection object. Another backend then has one boundary to implement.",
  "verification": "Try a second minimal implementation in a fixture. If replacing it requires edits across the core pipeline, inspect which assumptions escaped the boundary.",
  "limitations": "Indirection has a cost, and an interface cannot predict every future need. Keep it tied to real behavior instead of creating speculative layers. Swappability reduces the cost of a wrong choice; it does not make every choice equally good."
}
