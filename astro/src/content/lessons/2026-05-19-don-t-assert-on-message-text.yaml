{
  "date": "2026-05-19",
  "tag": "testing",
  "title": "Don't assert on message text.",
  "why": "Hundreds of tests checked error wording, so every copy edit broke them. Assert on a code or a field instead.",
  "problem": "A harmless wording change can break many tests when they assert on an error sentence instead of the behavior that produced it.",
  "cause": "The tests bind correctness to presentation. The message may change while the error category, state and exit behavior stay correct.",
  "steps": [
    "Give the result a stable code or structured field.",
    "Create a fixture that isolates the condition being checked.",
    "Assert on that structure and reserve text assertions for wording that is itself part of the contract."
  ],
  "solution": "For example, an invalid range can return an INVALID_RANGE code plus a helpful sentence. The behavior test should check the code and rejected operation, so improving the sentence does not rewrite the suite.",
  "verification": "Change only the human wording and expect behavior tests to stay green. Then change the error code or allow the invalid operation and expect a relevant test to fail.",
  "limitations": "User-facing copy can deserve dedicated checks, and some command-line interfaces promise exact text. Keep those expectations explicit rather than using message matching as a substitute for a missing structured result."
}
