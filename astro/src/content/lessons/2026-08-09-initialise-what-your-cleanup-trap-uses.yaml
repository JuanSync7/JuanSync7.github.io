  "tag": "shell",
  "title": "Initialise what your cleanup trap uses.",
  "why": "Under set -u, a trap that reads an unset variable fails itself, and the cleanup never runs.",
  "problem": "A shell script can fail before starting a background process, then fail again in its cleanup handler and leave other resources behind.",
  "cause": "With set -u, expanding an unset variable is an error. A trap that assumes a process id has already been assigned is unsafe on earlier exit paths.",
  "steps": [
    "Before registering the trap, initialise every variable it reads, using an empty value for a resource that does not yet exist.",
    "Guard each cleanup action with a check that the resource was created; update its variable immediately after creation."
  ],
  "solution": "For example, initialise tpid before installing a trap and only signal it when it contains the tunnel process id. Make partial setup a normal case the cleanup code handles.",
  "verification": "Force an exit before resource creation and another after it in a disposable run. Both should preserve the original failure while avoiding an unbound-variable error; the later case should remove the created resource.",
  "limitations": "Initialisation prevents this failure, but cleanup can still fail for other reasons. Avoid signalling an unrelated process and preserve useful diagnostics from the original error.",
