  "date": "2026-06-23",
  "tag": "systemd",
  "title": "MemoryHigh throttles. MemoryLimit kills.",
  "why": "On cgroup v2, MemoryHigh slows a service down. The older v1 MemoryLimit is a hard OOM kill. Know which one your host has.",
  "problem": "A memory-control setting can kill work when the operator intended only to slow it down, or have little effect because it was copied to the wrong cgroup version.",
  "cause": "MemoryHigh on cgroup v2 is a reclaim and throttling threshold. MemoryMax is the hard cap; the older MemoryLimit setting serves the hard-limit role on cgroup v1.",
  "steps": [
    "Identify the host’s cgroup version and supported systemd controls.",
    "Choose soft pressure and hard-stop limits according to the intended behavior.",
    "Inspect the effective unit settings and monitor how the service behaves under controlled pressure."
  ],
  "solution": "For a shared service, a soft ceiling can reduce its impact before a hard backstop is reached. Copying a v1 hard-limit directive as if it were a v2 throttle changes that operational contract.",
  "verification": "Use a safe bounded test workload and inspect reclaim, throttling and termination signals. A setting present in a file does not establish that the running host enforces it.",
  "limitations": "A soft threshold is not an absolute memory ceiling. A throttled service can look hung, and limits do not repair a leak; pair them with health checks and investigation."
}
