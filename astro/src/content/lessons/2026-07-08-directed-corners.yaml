  "title": "Random finds the surprises. Directed tests prove the corners.",
  "why": "Constrained random stimulus covers what you didn't think of; directed cases pin down the edges you did. A test plan needs both.",
  "problem": "A random test can exercise many transactions and still miss a boundary condition already known to be dangerous.",
  "cause": "Random generation explores combinations within its constraints. It does not guarantee that an exact edge case appears, especially when that case is rare or excluded by an unnoticed constraint.",
  "steps": [
    "Write directed tests for known boundaries, resets and error paths.",
    "Use constrained random traffic to explore legal combinations beyond that list.",
    "Compare both kinds of test against a simple reference model and record the seed on failure."
  ],
  "solution": "For example, test a queue becoming full directly, then randomize reads and writes around that boundary. The directed test protects a named rule; random traffic explores the interactions around it.",
  "verification": "Inspect coverage for the intended conditions rather than counting generated cycles. Replay a failing seed and confirm that the same stimulus reaches the same check.",
  "limitations": "A coverage hit does not prove the output was checked, and random testing only explores what the generator permits. Formal checks can complement both approaches when a property and tractable model are available."
}
