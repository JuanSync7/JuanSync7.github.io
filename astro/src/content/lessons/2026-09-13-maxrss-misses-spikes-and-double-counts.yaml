  "title": "MaxRSS misses spikes and double-counts shared pages.",
  "why": "It is sampled every 30 seconds, so short peaks vanish, and multi-process jobs can read up to 2x high. The cgroup high-water mark is the true peak.",
  "problem": "A memory history can suggest generous headroom while missing the short peak that actually determines whether a job survives.",
  "cause": "A periodic sampler sees only its sampling instants. Shared-page accounting can also inflate summed process memory, so the reported peak can err in either direction.",
  "steps": [
    "Record the source and interval of each memory metric.",
    "Capture the job's cgroup high-water mark where available.",
    "Keep sampled curves for timing and shape, while using the appropriate peak for sizing."
