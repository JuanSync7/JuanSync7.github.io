  "date": "2026-04-12",
  "tag": "frontend",
  "title": "esbuild strips types without checking them.",
  "why": "A green bundle says nothing about type errors. Run `tsc --noEmit` as its own gate.",
  "problem": "A TypeScript application can bundle successfully while containing type errors. A green build can therefore be mistaken for a stronger check than it actually provides.",
  "cause": "esbuild removes type annotations and produces JavaScript. It does not check whether assignments and function calls satisfy the TypeScript types.",
  "steps": [
    "Keep esbuild as the bundling step.",
    "Add tsc --noEmit as a separate required check.",
    "Make the verification command and CI run both steps, with missing tools treated as incomplete verification."
  ],
  "solution": "If a function expects a number and a caller passes text, bundling may still work. The type-checking step should catch the mismatch before the bundle is accepted.",
  "verification": "Introduce a small deliberate type mismatch in a disposable copy. Expect the type gate to fail even if bundling succeeds, then remove the fault and expect both checks to pass.",
  "limitations": "Type checks do not establish runtime API correctness. Handwritten interfaces can drift from real responses, so important boundaries also need contract or integration checks."
}
