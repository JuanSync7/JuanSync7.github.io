  "title": "Random checks need a seed, a snapshot and an oracle.",
  "why": "The seed replays any failure, one snapshot keeps a race from looking like a bug, and a simple evaluator that shares no code says what's right.",
  "problem": "A randomized live-data check can report a mismatch that cannot be reproduced, leaving it unclear whether the system or the check was wrong.",
