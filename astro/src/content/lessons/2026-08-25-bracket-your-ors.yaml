  "title": "Bracket your ORs.",
  "why": "A AND B OR C means (A AND B) OR C in most query languages. That silently dropped a date filter. Brackets make the intent explicit.",
  "problem": "A query meant to select recent records in either of two categories can include records outside its date range.",
  "cause": "In many query languages AND binds more tightly than OR. `recent AND category_b OR category_c` therefore admits every category_c record, regardless of the recent condition.",
  "steps": [
    "Write the intended grouping explicitly: `recent AND (category_b OR category_c)`.",
    "Place the grouping in the shared query builder, then inspect each caller that relies on its filters rather than patching only one report."
  ],
  "solution": "Use parentheses to make the common filter apply to both alternatives. Treat a change in result count as a reason to inspect membership, not automatic proof that either query is correct.",
  "verification": "Build four small cases: recent B, recent C, old B and old C. Expect only the first two. Add an unrelated category to confirm that the OR did not broaden the query beyond its intended set.",
  "limitations": "Operator rules and query syntax vary. Check the actual engine, and keep NULL behaviour and boundary timestamps as separate cases where they matter.",
