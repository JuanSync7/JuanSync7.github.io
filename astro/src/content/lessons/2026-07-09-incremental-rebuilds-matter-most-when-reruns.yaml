  "solution": "For example, editing one source document should invalidate its summary and consumers, while leaving unrelated summaries available. The reuse decision belongs to deterministic input tracking, not to a model’s opinion that nothing important changed.",
  "verification": "Change one fixture input and inspect the exact set of stages marked stale. Confirm that unrelated stages remain reusable and that changed configuration also invalidates the right results.",
  "limitations": "The declared dependency set must be complete. A reused model answer remains a saved accepted answer, not a promise that generating it again would produce identical text."
