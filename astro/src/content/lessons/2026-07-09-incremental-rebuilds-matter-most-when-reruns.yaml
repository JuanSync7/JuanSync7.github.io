  "title": "Incremental rebuilds matter most when reruns cost money.",
  "why": "Skipping unchanged steps saves minutes for a compiler and real money for an LLM step, where every rerun is billed.",
  "problem": "Rerunning an unchanged language-model stage spends money again even when its previous accepted result is still applicable.",
  "cause": "A dependency graph makes it possible to identify which results depend on changed inputs. Without that relationship, a small edit can trigger a full rebuild or leave old results looking current.",
