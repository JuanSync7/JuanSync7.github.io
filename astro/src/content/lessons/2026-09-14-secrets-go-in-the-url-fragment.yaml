{
  "date": "2026-09-14",
  "tag": "frontend",
  "title": "Secrets go in the URL fragment, not the query.",
  "why": "The #fragment never leaves the browser in requests or server logs. The query string ends up in both.",
  "problem": "A browser link can leak a secret into server request logs if the secret is placed in its query string.",
  "cause": "The URL fragment is handled client-side and is not included in the HTTP request target. Query parameters travel to the server, where normal access logging can retain them.",
  "steps": [
    "Keep the secret out of the request query.",
    "Read the fragment only in the intended client code.",
    "Remove it from the visible address after use and avoid forwarding it into another request or log."
  ],
  "solution": "Illustrative: a remote-control page can receive a one-time client value after # without the initial page request carrying that value to its host.",
  "verification": "Inspect the actual network request and server-side request logs in a disposable flow. The fragment value should be absent unless application code explicitly sends it later.",
  "limitations": "Fragments are still accessible to page scripts, extensions and anyone who sees the link. This limits one transport leak; it is not a complete secret-storage or authentication design.",
  "category": "frontend-and-design",
  "tags": [
    "security",
    "privacy",
    "frontend"
  ]
}
