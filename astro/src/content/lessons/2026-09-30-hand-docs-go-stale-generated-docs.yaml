  "title": "Hand docs go stale. Generated docs go wrong.",
  "why": "Nothing checks the prose of a hand doc, so it drifts. Generated docs are fluent, cited and sometimes false. Both need a drift test.",
  "problem": "Documentation can sound authoritative while describing a system that no longer exists.",
  "cause": "Handwritten claims drift when code changes without a corresponding edit. Generated prose can cite a source while misreading its meaning or pointing at an old revision; fluency and citation presence do not validate the claim.",
  "steps": [
    "Separate reference facts from rationale and history.",
    "Tie important current claims to code, a stable owner or an executable check.",
    "Recheck citations and semantics against the revised system before calling the documentation current."
  ],
  "solution": "Illustrative: a generated paragraph naming the correct source file can still misunderstand which service owns a table. Check the claimed relationship, not merely whether the link opens.",
  "verification": "Change a representative configuration fact in a disposable revision. The drift check or review should identify the stale claim, and a source inspection should confirm the corrected statement.",
  "limitations": "Mechanical checks cover only claims they can evaluate. Intent, omitted topics and data semantics still need informed review, and an evaluated generator is not automatically an adopted documentation workflow.",
