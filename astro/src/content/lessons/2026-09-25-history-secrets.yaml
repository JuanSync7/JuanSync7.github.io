  "tag": "security",
  "title": "Scan history for secrets, not just the tree.",
  "why": "Before the first push, check every commit. A secret deleted last week is still in the repo.",
  "problem": "A repository can expose a deleted credential on its first push even when its current files look clean.",
  "cause": "Git history retains earlier snapshots. Removing a value from the working tree does not remove it from reachable commits, and sending those commits sends the earlier value too.",
  "steps": [
    "Scan the working tree and the history that will be published.",
    "Check that the scanner actually ran and selected the intended commits.",
    "If a credential is found, handle revocation and history cleanup as separate tasks before publishing."
  ],
  "solution": "Illustrative: a token added in one commit and removed in the next still appears when the first commit is inspected. A head-only scan misses it.",
  "verification": "Use a harmless planted fixture to confirm that the history gate catches an added-then-deleted secret pattern and does not silently skip when its scanner is unavailable.",
  "limitations": "A scan is a detector, not proof that no secret exists. Rewriting history does not revoke a credential or erase copies already received elsewhere; those require their own response.",
  "category": "security-and-networking",
