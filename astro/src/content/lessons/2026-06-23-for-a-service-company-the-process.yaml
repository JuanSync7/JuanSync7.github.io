{
  "date": "2026-06-23",
  "tag": "process",
  "title": "For a service company, the process is the product.",
  "why": "The customer keeps the chip; the company keeps only how it was delivered. So capture lessons on the spot, not in a hindsight review.",
  "problem": "A delivery organization can finish a project while losing the knowledge of how its team solved the difficult parts. The customer retains the deliverable; the process lessons may remain only in memory.",
  "cause": "An end-of-project summary is both late and compressed. It can omit the decisions, failed assumptions and local checks that made the lesson transferable.",
  "steps": [
    "Capture a mistake or useful practice when it happens.",
    "Record the problem, cause, correction and evidence in enough detail to reuse.",
    "Turn a recurring lesson into a maintained process or check with an owner."
  ],
  "solution": "If an input handoff fails, capture which contract was missing and how to detect that condition next time. That gives the next team a correction they can apply, rather than only a story that the project was difficult.",
  "verification": "Ask a fresh reader whether the record tells them when the problem applies and how to check the correction. A lesson has transferred when it supports a usable change.",
  "limitations": "This is the source’s organizational argument, not a measured company outcome. Capture should improve the process and avoid assigning blame to an employee."
}
