  "title": "A bind mount pins the old file.",
  "why": "Sessions that mounted a file keep seeing that version even after it is replaced on disk. Restart them after an update.",
  "problem": "A long-running session can keep reading an old policy file after deployment has replaced the file visible to new sessions.",
  "cause": "A file bind mount can keep referring to the mounted object while an atomic replacement changes what the original pathname resolves to. Updating the pathname does not necessarily replace that existing mount.",
