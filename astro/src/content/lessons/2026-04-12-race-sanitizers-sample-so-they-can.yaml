  "title": "Race sanitizers sample, so they can miss and misfire.",
  "why": "Tracking every reader's clock costs too much memory, so only a sample is kept. Races with old reads slip by, and a wrapped clock buffer reports races that never happened.",
  "problem": "GSan, a race sanitizer for Triton and Gluon GPU code, can miss a real race or report one that did not occur. Treating its output as a complete account of memory ordering is too strong.",
  "cause": "GSan uses logical clocks: records of which accesses are ordered by synchronization. Tracking every reader’s clock is expensive. Sampling leaves some older reads untracked, while reuse of a wrapped clock buffer can confuse the recorded history.",
  "steps": [
    "Understand what the sanitizer records and what it samples.",
    "For a report, inspect the conflicting accesses and the synchronization between them.",
    "For a clean run, keep the sampling limit in mind and check critical shared-memory protocols separately."
  ],
  "solution": "Inspect synchronization as well as the report. For example, a producer writes a shared value, then signals completion; a consumer waits for that signal before reading it. If that synchronization orders the write before the read, those two accesses are ordered. Without the wait, their apparent order in a log does not establish safety. This is an illustrative check, not a tested kernel.",
  "verification": "For a suspected access pair, identify the synchronization operation that orders one before the other. If supported by the GSan configuration, more read samples or a larger clock buffer can reduce these failure modes at the cost of memory. Repeated silence still does not prove every access is ordered.",
  "limitations": "These limits describe GSan’s sampled clock design. Its synchronization must be instrumented and recognized; code or synchronization outside its coverage can cause missed races or misleading reports. Other sanitizers may track ordering differently."
