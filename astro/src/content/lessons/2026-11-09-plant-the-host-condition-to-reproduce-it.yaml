  "limitations": "This works for conditions Python code reaches through something you can patch at start-up. It does not reproduce kernel, file system or hardware differences, and sitecustomize is not loaded when `PYTHONPATH` is ignored (`-E`, `-I`) or `site` is off (`-S`).",
