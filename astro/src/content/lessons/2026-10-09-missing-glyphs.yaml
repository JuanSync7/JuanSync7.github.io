  "title": "Missing glyphs look like missing words.",
  "why": "Blank gaps in the terminal were font coverage, not locale. fc-list :charset=<hex> shows which fonts have the character.",
  "problem": "Blank gaps in terminal output can look like lost words or a broken locale. First separate a problem identifying the character from a problem drawing a valid character.",
