  "title": "Writing like me means keeping my structure, not copying my slips.",
  "why": "My casual messages show how I explain a problem. They also contain grammar I do not want carried into a finished post.",
  "problem": "A writing sample mixes several things: the order of the argument, the words I choose, the detail I give and the speed at which I typed it. Copy all of that and a polished draft starts repeating casual errors. Smooth everything away and it loses the way I think.",
  "cause": "Surface imitation treats every feature of a sample as part of the voice. My October 30 guidance separates the useful structure and directness from the casual register.",
