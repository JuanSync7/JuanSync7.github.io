    "Choose an original sample that fits the kind of writing. A work explanation and a status update have different jobs.",
    "Follow its reasoning: state the point, explain the cause, show a worked example where useful and give the next step. Keep uncertainty tied to what is actually uncertain.",
    "Edit grammar and remove repeated points. Compare the draft with the sample again: does it still make the same kind of direct, concrete explanation?"
