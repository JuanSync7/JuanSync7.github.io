  "title": "A heading's closing hashes vanish.",
  "why": "In CommonMark `# Drain procedure #` renders as 'Drain procedure', so a trailing # in a title is silently lost.",
  "problem": "A converted title can lose a literal hash at its end even though the generated Markdown looks close to the source.",
  "cause": "In CommonMark, a space followed by trailing hashes can close an ATX heading. Those hashes are syntax, so the renderer omits them from the visible title.",
  "steps": [
    "When emitting source text into a Markdown heading, distinguish literal punctuation from the heading marker.",
    "Escape a literal trailing hash: for example, emit `# Drain procedure \\#` when the visible title must end in a hash."
  ],
  "solution": "Test the rendered title rather than comparing raw Markdown alone. The unescaped `# Drain procedure #` and the escaped form carry different visible text.",
