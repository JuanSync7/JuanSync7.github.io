{
  "date": "2026-05-25",
  "tag": "security",
  "title": "Skills are words. Hooks are code.",
  "why": "An instruction file can't widen permissions; a hook or tool server can run anything. Lock each down by its own risk.",
  "problem": "A plugin may look like a collection of instructions while also launching executable hooks or tool-server processes.",
  "cause": "The bundle name hides several different mechanisms. Text can guide an agent; executable components act through the host permissions and process-launch path.",
  "steps": [
    "Inventory the instructions, commands, hooks and tool servers in the bundle.",
    "Review executable parts under the host’s process and network controls.",
    "Check actual launch behavior rather than assuming a tool-exposure allowlist prevents execution."
  ],
  "solution": "A tool server can be absent from the exposed tool list yet still be launched by the host. Treat “the agent cannot call this tool” and “this process cannot start” as separate claims.",
  "verification": "Inspect launch records in a controlled setup and compare them with the intended policy. Verify the specific boundary being claimed instead of inferring it from a configuration label.",
  "limitations": "Instruction text can still influence decisions and trigger allowed actions. The distinction is about enforcement mechanisms, not a claim that words are harmless or that every plugin has the same capabilities."
}
