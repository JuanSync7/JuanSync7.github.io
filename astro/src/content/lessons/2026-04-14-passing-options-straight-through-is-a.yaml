  "title": "Passing options straight through is a privilege.",
  "why": "A config value forwarded as raw options lets whoever edits the config run anything the tool allows. Name the options you accept.",
  "problem": "A configuration field can become an unintended command surface when its value is passed straight through as tool options.",
  "cause": "The tool interprets those options with its own authority. Whoever edits the configuration may gain behaviors the surrounding application never intended to expose.",
  "steps": [
    "List the specific behaviors the configuration needs to control.",
    "Represent them as named, typed fields with allowed values.",
    "Construct the tool arguments from those fields and reject unknown options."
  ],
  "solution": "For example, expose a timeout as a bounded numeric setting rather than a free-form “extra arguments” string. The caller can change the timeout without gaining every other operation supported by the underlying command.",
  "verification": "Try an unknown field and an out-of-range value. Expect validation to reject each before the tool starts, and check that valid settings produce only the intended arguments.",
  "limitations": "An expert-facing wrapper may deliberately expose a raw command interface. That needs an explicit trust contract; calling the input “configuration” does not make it a smaller interface.",
