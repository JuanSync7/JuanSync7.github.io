  "title": "Coverage is a number. The holes are the to-do list.",
  "why": "Pushing ATPG coverage up meant chasing each uncovered fault class one by one. The percentage says how far you are; the holes say what to do next.",
  "problem": "A test-coverage percentage tells you how much fault space is covered, but gives little direction for the next repair.",
  "cause": "ATPG generates manufacturing test patterns against a fault model. Uncovered faults have different causes: some are unreachable, some lack control or observation, and some expose a setup or design problem.",
  "steps": [
    "Group uncovered faults by the tool’s reported class and reason.",
    "Inspect representative faults and trace what prevents activation or observation.",
    "Change the design, test setup or justified exclusions, then rerun the relevant analysis."
