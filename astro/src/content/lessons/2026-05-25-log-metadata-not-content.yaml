  "title": "Log metadata, not content.",
  "why": "Prompts are private, and anyone with log access could read them. Metadata alone still attributes usage and cost to each person, cheaply.",
  "problem": "Usage logging can make private prompts and responses readable to anyone who has log access. Cost visibility does not require exposing those contents.",
  "cause": "Invocation records can contain both operational metadata and message bodies. Enabling them together turns a metering decision into a separate data-access decision.",
  "steps": [
    "List the fields needed for attribution and cost reporting.",
    "Disable content-delivery fields unless there is a separately justified need.",
    "Set access and retention for the remaining metadata and verify a real record."
  ],
  "solution": "Keep identity, model, time and token usage where the service supports them, while leaving prompt text out. This gives an operator a way to understand usage without storing the engineering conversation itself.",
  "verification": "Inspect an emitted record for both required metadata and absent message content. Configuration flags alone are weaker evidence than the record the service actually wrote.",
  "limitations": "Metadata can still be sensitive and may not provide complete identity in every service. Content capture for agent improvement is a separate decision with its own scope and access controls.",
