  "title": "Embed the body, not the front matter.",
  "why": "On small documents the metadata header can be most of the tokens, so the vector ends up describing the header, not the content.",
  "problem": "A short document’s embedding can describe its metadata more strongly than its useful prose when the header contains long hashes and bookkeeping fields.",
  "cause": "The embedding sees the tokens it is given. Front matter can dominate a small file even though those fields say little about the subject a reader wants to find.",
  "steps": [
    "Parse the front matter as structured metadata.",
    "Embed the meaningful document body.",
    "Keep identifiers, provenance and filter fields alongside the vector rather than mixing every field into its text input."
  ],
  "solution": "A short note with two long digests can spend much of its token budget on identifiers. Removing those fields from the embedding input leaves more of the representation devoted to the note’s actual explanation.",
  "verification": "Inspect the exact text sent to the embedding model and its token composition. Then compare retrieval on representative content questions while confirming that metadata filters still work.",
  "limitations": "Some titles and concise contextual labels improve retrieval. The boundary is deliberate selection of useful context, not a requirement to discard every metadata field or the provenance needed to audit a result."
