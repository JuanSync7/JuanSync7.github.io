  "title": "When a layout choice is unclear, ask what the page is for.",
  "why": "Restate the decision in terms of what the reader came to do. The answer usually picks the option.",
  "problem": "A layout debate can drift into personal preference when neither option is tied to the reader's task.",
  "cause": "Different placements serve different actions. Without deciding what the reader needs first, visual comparison has no shared basis for choosing between otherwise reasonable options.",
  "steps": [
    "State the reader's immediate question or action.",
    "Compare how each layout helps complete it.",
    "Use a small realistic example to inspect the trade-off and record the chosen reason."
  ],
  "solution": "Illustrative: a history control needed for frequent comparison may belong near the comparison figures, while a rarely used configuration control may suit a quieter location. The task explains the placement.",
  "verification": "Ask a reader to complete the named task in each candidate layout. Observe whether the needed information and controls are found in the intended order.",
  "limitations": "Several tasks can be equally important. If the task evidence does not distinguish the options, keep the choice reversible and identify what later observation would justify changing it.",
