  "title": "grep -q under pipefail can fail on a match.",
  "why": "grep exits as soon as it matches, the writer gets SIGPIPE, and pipefail reports the whole pipe as failed.",
  "problem": "A shell check can find the expected text and still make a deployment script stop. That makes a working host look broken.",
  "cause": "With pipefail enabled, every process contributes to pipeline status. grep -q exits after its first match; a producer still writing can receive SIGPIPE when the reader closes.",
  "steps": [
    "Keep pipefail enabled and inspect each pipeline status.",
    "Replace the early-exit reader with one that consumes the full stream, such as grep -c, and interpret its result deliberately.",
    "Keep a genuine producer error distinct from a missing match."
  ],
  "solution": "Illustrative: a long package listing piped to grep -q can fail only when the match appears early. Consuming the whole listing removes that timing-dependent broken pipe without hiding real errors.",
