{
  "date": "2026-08-11",
  "tag": "build",
  "title": "Everything the tool reads belongs in the cache key.",
  "why": "Headers pulled in through an include directory were left out of the key, so a stale result was served as current.",
  "problem": "A build cache can return an old result after a header changes, even though the top-level source file and command are unchanged.",
  "cause": "An include-directory option names where a tool looks, but the tool also reads files found there. If those bytes are absent from the cache key, different computations can share one identity.",
  "steps": [
    "Enumerate the complete input set, including resolved headers, configuration and other files the tool reads indirectly.",
    "Build the key from their content and the relevant invocation, then version the key format so incomplete old entries become misses."
  ],
  "solution": "For a source that includes a header, changing only that header must change the computation’s key. Treat the include path as a search rule, not a substitute for the files selected through it.",
  "verification": "Populate a disposable cache, change an included header and request the result again. Expect a miss and recomputation. An unchanged input set should still be eligible for a hit.",
  "limitations": "A sound key depends on discovering every meaningful input. Hidden environment or tool-version dependencies can create the same stale-result problem even after headers are included."
}
