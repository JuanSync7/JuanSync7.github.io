{
  "date": "2026-07-01",
  "tag": "security",
  "title": "A shared service account collapses identity.",
  "why": "When everyone runs as one account, the log can't say who did what. Per-person identity has to be kept above it.",
  "problem": "Audit records can name the process account correctly and still fail to identify the person responsible for a request.",
  "cause": "When several people reach a service through one Unix account or API key, that shared identity is all the downstream system sees. A typed username does not restore authentication.",
  "steps": [
    "Authenticate the person before the request reaches the shared service.",
    "Carry a stable caller id through authorization and audit records.",
    "Record the executing agent or service separately from the person who authorized its action."
  ],
  "solution": "Keep both identities. In an illustrative record, a service executes a change while a separately authenticated user authorizes it. This preserves useful attribution without pretending the service credential belongs to one person.",
  "verification": "Send two requests as different authenticated users through the same service account. Their audit records should retain distinct callers while showing the same executor.",
  "limitations": "Attribution depends on the front layer being trustworthy and hard to bypass. Kernel uid alone cannot distinguish people who already share the same account.",
  "category": "security-and-networking",
  "tags": [
    "security",
    "observability"
  ]
}
