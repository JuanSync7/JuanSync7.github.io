  "tag": "linux",
  "title": "A shared home carries more than files.",
  "why": "With linger on and an NFS home, every batch job started my user services on the compute node too.",
  "problem": "A batch launch can unexpectedly start a second copy of user services on a compute node.",
  "cause": "A shared home exposes the same user-unit files on several hosts. When a scheduler prolog enables linger and starts the user manager, enabled units can start wherever that manager runs.",
  "steps": [
    "Inventory enabled services and timers in the shared home.",
    "Confine host-specific units with an explicit host condition.",
    "Guard newly enabled units with the same rule and inspect for existing duplicate processes."
  ],
  "solution": "Illustrative: a tunnel intended for one home host can start again on a farm node simply because both hosts read the same enabled unit tree. Host conditions express where that service belongs.",
  "verification": "Check the effective units on an allowed host and a disallowed host. The intended host should run them; the other should skip them without launching duplicate work.",
  "limitations": "This is host placement, not an authorization barrier. A skipped condition is appropriate for optional placement but should not be mistaken for a failed prerequisite guard on a protected service."
