  "solution": "Illustrative: a modest semibold section title followed by a clear gap can distinguish a group without pushing its key values below the fold. Keep the main finding visually distinct from routine labels.",
  "verification": "Scan the page at normal viewing size and browser zoom. The reader should identify the main finding and section boundaries without losing access to small text.",
