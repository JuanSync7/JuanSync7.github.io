  "title": "`import a.b` binds a, not b.",
  "why": "The name added to your namespace is the top package. Any tool that resolves or patches imports has to follow that rule.",
  "problem": "A code graph or patch target can point at the wrong object even when the import statement itself is valid.",
  "cause": "Python separates loading a module from binding a local name. With import a.b, the local name is a; treating a.b as the bound name loses the first step of attribute lookup.",
