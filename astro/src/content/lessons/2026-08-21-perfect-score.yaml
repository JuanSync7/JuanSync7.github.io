  "date": "2026-08-21",
  "tag": "evals",
  "title": "A score can be perfect while the output is wrong.",
  "why": "Word recall was 1.0 while list nesting and emphasis were broken. A word count can't see structure; structure needs its own check.",
  "problem": "A document converter can preserve every word while damaging list nesting, emphasis and the relationships that make the document readable.",
  "cause": "Word recall measures retained text. It cannot tell whether a phrase moved into the wrong list item or whether a heading was flattened into ordinary prose.",
  "steps": [
    "Keep text-retention checks, then add a separate reference for headings, lists, tables, links and emphasis.",
    "Derive that reference independently from the source format, rather than copying the converter’s own assumptions into its grader."
  ],
  "solution": "For a nested list, compare which item owns each child, not merely whether all words appear. Give unsupported formatting an explicit receipt instead of counting silent flattening as faithful conversion.",
  "verification": "Use a fixture with identical words in two different nesting structures. The word score may match, but the structure check should distinguish them and identify the changed relationship.",
  "limitations": "A structure score is only as good as the facts and reference it checks. Independent extraction reduces shared mistakes but still needs review for omitted source semantics."
}
