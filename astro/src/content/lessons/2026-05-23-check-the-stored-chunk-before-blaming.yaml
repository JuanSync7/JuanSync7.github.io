  "title": "Check the stored chunk before blaming the model.",
  "why": "A wrong answer about a PDF table came from corruption at parse time. Swapping the LLM would never have fixed it.",
  "problem": "A wrong answer about a PDF table can send debugging toward the language model even when the wrong numbers were already stored in retrieval.",
  "cause": "An index faithfully returns the chunks it receives. If parsing corrupted the table, retrieval and generation can both behave as designed while propagating that error.",
  "steps": [
    "Read the retrieved chunk exactly as stored.",
    "Compare its table values and relationships with the source page.",
    "Fix extraction and rebuild the affected content before changing the answer model."
