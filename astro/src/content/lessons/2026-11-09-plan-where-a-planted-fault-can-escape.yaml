  "title": "Before planting a fault, write down what it could reach if it ignored your fakes.",
  "why": "A mutant of code that stops processes inverted its own filter and stopped every process the user owned. Run planted faults only where their worst escape reaches nothing real.",
  "problem": "Mutation testing plants small faults to see if tests catch them. On a sweep meant to stop only one run's processes, a mutant inverted the \"belongs to this run\" filter. The sweep then sent TERM and KILL to every process the user owned, three times, including their remote shells and the mutation runner, which left the source file mutated.",
  "cause": "A planted fault is a real bug for as long as it runs. The tests' fakes protect only code that uses them; a mutant that ignores them reaches the real system.",
