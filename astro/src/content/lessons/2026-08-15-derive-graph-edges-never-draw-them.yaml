{
  "date": "2026-08-15",
  "tag": "design",
  "title": "Derive graph edges. Never draw them.",
  "why": "A graph view is a projection of a store. Hand-drawn edges go stale; edges aggregated from the data can't.",
  "problem": "A graph can look convincing while missing the relationships needed to understand a change’s downstream effects.",
  "cause": "If someone keeps the picture’s edges separately from the underlying store, each edit creates a chance for the two descriptions to disagree.",
  "steps": [
    "Store relationship identity and meaning with the underlying entities, then generate the displayed edges from those records.",
    "Keep layout choices separate from relationship data, and make missing endpoints or unsupported relationship types visible."
  ],
  "solution": "For a dependency view, changing a stored dependency should change the next rendered graph without someone manually redrawing a line. Different zoom levels can summarize the same relationships.",
  "verification": "Compare rendered edge identities with a small known store and test an added, removed and broken relationship. Check propagation behaviour separately if those edges also drive stale-state calculation.",
  "limitations": "Derived views can still be stale when caches, queries or source records are wrong. The original card’s “can’t” is too absolute; derivation removes manual duplication, not every failure mode."
}
