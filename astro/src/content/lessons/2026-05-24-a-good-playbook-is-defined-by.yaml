{
  "date": "2026-05-24",
  "tag": "agents",
  "title": "A good playbook is defined by its edges.",
  "why": "In scope, out of scope, reject when. A skill without boundaries does a little of everything and nothing reliably.",
  "problem": "A playbook becomes unreliable when it tries to help with every nearby task. Readers cannot tell when to use it or when it should stop.",
  "cause": "Without explicit boundaries, the same instructions are applied to cases with different prerequisites and risks.",
  "steps": [
    "State the task the playbook owns.",
    "Name the adjacent work it excludes and the conditions that require rejection.",
    "Describe the inputs, expected result and route for a case outside its scope."
  ],
  "solution": "For example, a read-only reporting playbook can explain how to collect and summarise data while directing configuration changes to another procedure. That keeps a request for a report from quietly becoming permission to alter the system.",
  "verification": "Try a clear in-scope case, a nearby out-of-scope case and a case missing a prerequisite. Expect useful execution for the first and a clear boundary or handoff for the others.",
  "limitations": "Boundaries need maintenance as tools change. A rejection should explain the missing condition or next route; “out of scope” by itself does not help someone finish the work."
}
