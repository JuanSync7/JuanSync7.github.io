{
  "date": "2026-10-22",
  "tag": "Tooling",
  "title": "A command should tell the operator what to do next.",
  "why": "Every make command became a small guide: explain the fix when it fails, or show the follow-on commands when it succeeds.",
  "problem": "An operator runs a command, gets a result and still has to search the documentation to work out the next action. Knowing the exit code does not explain how to recover or continue.",
  "cause": "The commands handled their own work, but the route between them lived elsewhere. Advice printed in individual scripts could also drift away from the targets and arguments that actually existed.",
  "steps": [
    "Write down the command routes: what can follow success, what can recover a failure and where the flow finishes.",
    "Print a short Next block at command exit. Say what each suggested command does.",
    "Check the routes in CI: targets exist, nodes are reachable, paths can finish and suggested arguments are read by the next target."
  ],
  "solution": "Keep command navigation in a checked graph and let the command print the relevant part. Retry advice should carry values the operator typed, while asking for confirmation again when the action needs it.",
  "verification": "The work began on October 22 with a spec, plan and graph checker. Final review fixes merged on October 23, including cancellation handling and argument-carry checks.",
  "limitations": "The final changes were checked on the host, but the container walk was not rerun for that final PR. A checked command graph does not prove every live operating environment."
}
