name: Checks

on:
  pull_request:
  push:
    branches-ignore: ["main"]

defaults:
  run:
    working-directory: astro

jobs:
  icon-ownership:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Asset boundary or independently reviewed maintainer change
        env:
          SLIDE_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          SLIDE_GUARD_PATH="$RUNNER_TEMP/slide-guard.py"
          if git cat-file -e "$SLIDE_BASE:astro/scripts/slides/checks/guard.py" 2>/dev/null; then
            git show "$SLIDE_BASE:astro/scripts/slides/checks/guard.py" > "$SLIDE_GUARD_PATH"
          else
            cp scripts/slides/checks/guard.py "$SLIDE_GUARD_PATH"
          fi
          python3 "$SLIDE_GUARD_PATH" --base "$SLIDE_BASE" --mode maintainer
  checks:
    # Pinned: ubuntu-latest moved to Ubuntu 26 on 19 Oct 2026, and Playwright 1.56's
    # --with-deps only knows Ubuntu up to 24.04, so the Chromium install fails there.
    # Move to ubuntu-latest again once Playwright supports the new image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: astro/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Types, lint, figure source and post shape checks
        run: npm run check
      - name: Voxel generation, diversity, negative fixtures and motion
        run: npm run voxel:check
      - name: Post check selftest (every rule still catches its broken post)
        run: npm run posts:selftest
      - name: Hardware geometry, seed and SVG checks
        run: npm run hardware:check
      - name: Build
        run: npm run build
      - name: Public vault page and static data boundary
        run: npm run vault:page && npm run presentation:page
      - name: Install Chromium for the figure look
        run: npx playwright install --with-deps chromium
      - name: Voxel GPU, controls, biome profiles and snapshot replay
        run: npm run voxel:gpu && npm run voxel:browser && npm run voxel:gallery -- --profile && npm run voxel:vault-check
      - name: Voxel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxel-agent
          path: astro/figures-out
      - name: Cabinet figure audit and six-frame sheet
        run: npm run figure -- vault-cabinet
      - name: Cabinet figure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vault-cabinet-figure
          path: |
            astro/figures-out/vault-cabinet*
            astro/figures-out/report.json
      - name: Presentation pages, paper actions and motion
        run: npm run presentation:browser
      - name: Presentation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vault-presentation
          path: astro/presentation-out
      - name: Slide icon vector and ZIP checks
        run: npm run slides:check
      - name: Open icon catalog and staging transaction
        run: npm run slides:extension
      - name: Unchanged icon reuse and stale-export rejection
        run: npm run slides:reuse-check
      - name: Playbook evaluation record status
        run: npm run slides:eval-check -- ../docs/design/slide-icons/evaluation/evaluation.json
      - name: Design system browsing and clipboard
        run: node scripts/design-system/browser-check.mjs
      - name: Design system screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-system
          path: astro/design-system-out
      - name: Lesson browsing (grouping, filters, history, mobile and no JavaScript)
        run: npm run lessons:browser
      - name: Slide icon browsing and exports
        run: npm run slides:browser
      - name: Slide icon screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slide-icons
          path: astro/slides-out
      - name: Hardware atlas browsing and exports
        run: npm run hardware:browser
      - name: Hardware atlas screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-atlas
          path: astro/hardware-out
      - name: Figure audit selftest (every check still catches its fixture)
        run: npm run figures:selftest
      - name: Figure look
        run: npm run figures:look -- --no-sheet
      - name: Keep the sheets when the look fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: figure-sheets
          path: astro/figures-out
